<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PetID</title>
  <desc id="desc">PetID, Siempre Contigo. Identidad digital de mascotas.</desc>

  <!-- Tag icon -->
  <g transform="translate(35 35)">
    <circle cx="175" cy="175" r="150" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <circle cx="175" cy="18" r="34" fill="none" stroke="#FFFFFF" stroke-width="22"/>

    <!-- Dog profile -->
    <path d="M86 214
             C89 177 101 135 129 111
             C149 94 172 89 192 98
             C208 105 221 118 235 129
             C247 139 262 145 277 145
             C288 145 296 151 297 161
             C298 172 289 179 278 181
             L252 185
             C244 187 239 193 238 202
             L235 246
             C233 272 217 291 190 298
             L137 311
             C112 317 91 304 84 282
             C79 265 81 235 86 214 Z"
          fill="none"
          stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Dog ear / neck contour -->
    <path d="M129 111 C113 133 108 157 111 181"
          fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M174 139 C173 154 172 168 170 181"
          fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="221" cy="145" r="8" fill="#FFFFFF"/>

    <!-- QR-inspired identity modules -->
    <rect x="249" y="207" width="35" height="35" rx="6" fill="#FFFFFF"/>
    <rect x="288" y="207" width="35" height="35" rx="6" fill="#FFFFFF"/>
    <rect x="249" y="246" width="35" height="35" rx="6" fill="#FFFFFF"/>
    <rect x="288" y="252" width="22" height="22" rx="5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(390 145)">
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif"
          font-size="112" font-weight="800" letter-spacing="-6" fill="#FFFFFF">Pet</text>
    <text x="252" y="112" font-family="Arial, Helvetica, sans-serif"
          font-size="112" font-weight="800" letter-spacing="-6" fill="#FFFFFF">ID</text>
    <text x="4" y="164" font-family="Arial, Helvetica, sans-serif"
          font-size="22" font-weight="500" letter-spacing="9" fill="#FFFFFF">SIEMPRE CONTIGO</text>
  </g>
</svg>