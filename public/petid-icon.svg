<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 280" role="img" aria-labelledby="title desc">
  <title id="title">PetID icon</title>
  <desc id="desc">Circular dog tag medal with dog silhouette profile</desc>

  <!-- Ring/loop at top -->
  <circle cx="128" cy="24" r="20" fill="none" stroke="#1F1F1F" stroke-width="8"/>
  <circle cx="128" cy="24" r="12" fill="#FFF7E9"/>

  <!-- Connection from ring to medal -->
  <rect x="121" y="38" width="14" height="20" rx="4" fill="#1F1F1F"/>

  <!-- Medal outer circle -->
  <circle cx="128" cy="168" r="108" fill="#FF6B6B"/>

  <!-- Gold border ring -->
  <circle cx="128" cy="168" r="96" fill="none" stroke="#FFC857" stroke-width="4"/>

  <!-- Inner cream circle -->
  <circle cx="128" cy="168" r="88" fill="#FFF7E9"/>

  <!-- Dog silhouette profile (facing right, clean minimal) -->
  <path d="
    M 96,212
    C 88,208 82,198 80,186
    C 78,174 80,162 86,152
    C 90,146 92,140 92,132
    C 92,124 96,116 102,112
    C 100,104 96,94 94,88
    C 92,82 94,76 100,78
    C 106,80 110,86 112,92
    C 114,86 118,82 124,80
    C 130,78 136,80 140,84
    C 144,88 148,94 152,98
    C 156,94 162,92 166,94
    C 170,96 172,100 170,104
    C 168,108 164,110 160,110
    C 164,116 166,122 166,128
    C 166,136 164,142 158,148
    C 154,152 150,156 148,162
    C 146,170 146,178 148,186
    C 150,194 148,202 142,208
    C 138,212 132,214 126,214
    C 118,214 108,214 96,212
    Z
  " fill="#1F1F1F"/>

  <!-- Dog ear -->
  <path d="
    M 102,112
    C 96,106 88,104 82,108
    C 76,112 74,120 78,128
    C 80,132 84,134 88,132
    C 92,128 96,120 102,112
    Z
  " fill="#1F1F1F"/>

  <!-- Eye -->
  <circle cx="126" cy="108" r="5" fill="#FFF7E9"/>
  <circle cx="127.5" cy="108" r="2.5" fill="#FF6B6B"/>

  <!-- Nose -->
  <ellipse cx="158" cy="108" rx="7" ry="5.5" fill="#FFC857"/>

  <!-- Collar -->
  <path d="M 90,196 C 100,204 114,208 128,208 C 142,208 152,204 160,196"
        fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>

  <!-- Collar tag (small) -->
  <circle cx="128" cy="210" r="6" fill="#FFC857"/>
  <circle cx="128" cy="208" r="2" fill="#1F1F1F"/>

  <!-- Subtle medal edge shine -->
  <circle cx="128" cy="168" r="108" fill="none" stroke="#E55A5A" stroke-width="1.5" opacity="0.2"/>
</svg>
